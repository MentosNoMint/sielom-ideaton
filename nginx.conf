server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf+json font/ttf;

    # Same as vercel.json: event state comes from the events platform.
    location /api/ {
        proxy_pass https://events.sielom.ru;
        proxy_ssl_server_name on;
        proxy_set_header Host events.sielom.ru;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
